name: NoVanillaLog
version: "1.2.8"
main: cn.nskc.spawn.novanillalog.NoVanillaLogPlugin
api-version: "1.21"
folia-supported: true
description: Suppress vanilla command spam from console and in-game chat
author: NSKC
website: https://github.com/nskc-spawn/NoVanillaLog

commands:
  novanillalog:
    description: Reload NoVanillaLog filter patterns
    usage: /novanillalog reload
    permission: novanillalog.reload
    aliases: [nvl]

permissions:
  novanillalog.reload:
    description: Allows reloading NoVanillaLog filter patterns
    default: op
